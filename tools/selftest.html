<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>uruchamianie testów…</title>
<link rel="stylesheet" href="../app.css">
</head>
<body>
<div class="panel" style="max-width:900px;margin:24px auto">
  <h1>PV Formalność 2.0 — testy wersji web</h1>
  <pre id="out">Uruchamianie…</pre>
</div>
<div id="app"></div>

<script src="../js/model.js?v=2.0.0i&n=9"></script>
<script src="../js/payment.js?v=2.0.0i&n=9"></script>
<script src="../js/pdf.js?v=2.0.0i&n=9"></script>
<script src="../js/app.js?v=2.0.0i&n=9"></script>
<script>
(function () {
  "use strict";
  const out = document.getElementById("out");
  const lines = [];
  let pass = 0, fail = 0;
  const consoleErrors = [];
  let lastPdfPageCount = 0;
  const origConsoleError = console.error;
  console.error = function () {
    consoleErrors.push([].slice.call(arguments).join(" "));
    origConsoleError.apply(console, arguments);
  };
  window.addEventListener("error", function (e) { consoleErrors.push("window.onerror: " + e.message); });
  window.addEventListener("unhandledrejection", function (e) { consoleErrors.push("unhandledrejection: " + e.reason); });

  function ok(name, condition, detail) {
    if (condition) { pass++; lines.push("PASS  " + name); }
    else { fail++; lines.push("FAIL  " + name + (detail ? "  -> " + detail : "")); }
    out.textContent = lines.join("\n");
  }

  function finish() {
    lines.push("", "TOTAL " + pass + " PASS / " + fail + " FAIL");
    document.title = (fail ? "FAIL " : "PASS ") + pass + "/" + (pass + fail);
    out.textContent = lines.join("\n");
  }

  function nextTick() {
    return new Promise(function (res) { setTimeout(res, 60); });
  }
  function wait(ms) {
    return new Promise(function (res) { setTimeout(res, ms || 60); });
  }
  function previewPainted() {
    const c = document.querySelector("#preview-canvas");
    if (!c) return false;
    const d = c.getContext("2d").getImageData(10, 10, 1, 1).data;
    return d[3] === 255;
  }

  function headerPixel() {
    const c = document.querySelector("#preview-canvas");
    if (!c) return "";
    const d = c.getContext("2d").getImageData(20, 20, 1, 1).data;
    return [d[0], d[1], d[2]].join(",");
  }

  // Przechwyć obraz JPEG, który trafia do PDF — bez faktycznego pobierania pliku.
  async function capturePdfImage(btnSel) {
    const pdf = window.PVPdf;
    const orig = pdf.buildPdf;
    let captured = null;
    pdf.buildPdf = function (images) {
      lastPdfPageCount = images ? images.length : 0;
      const bytes = images && images[0] && images[0].bytes;
      if (bytes && bytes.length) {
        captured = new Uint8Array(bytes);
        return new Uint8Array([37, 80, 68, 70, 45, 49, 46, 52]);
      }
      return orig.apply(pdf, arguments);
    };
    try {
      const btn = document.querySelector(btnSel);
      if (!btn) return null;
      btn.click();
      await wait(600);
    } finally {
      pdf.buildPdf = orig;
    }
    return captured;
  }

  // PV używa bezpośrednio PVPdf.renderPdf(theme) — sprawdź przekazany motyw.
  async function captureRenderTheme(btnSel) {
    const pdf = window.PVPdf;
    const orig = pdf.renderPdf;
    let seen = null;
    pdf.renderPdf = function (r, e, o, theme) {
      seen = theme;
      return new Uint8Array([37, 80, 68, 70, 45, 49, 46, 52]);
    };
    try {
      const btn = document.querySelector(btnSel);
      if (!btn) return null;
      btn.click();
      await wait(400);
    } finally {
      pdf.renderPdf = orig;
    }
    return seen;
  }

  function bytesFingerprint(bytes) {
    if (!bytes) return "";
    return bytes.length + ":" + Array.prototype.map.call(bytes.subarray(0, 64), function (b) { return b; }).join(",");
  }

  async function setTheme(id) {
    const sel = document.querySelector("#f-pdf-theme");
    if (!sel) return false;
    sel.value = id;
    sel.dispatchEvent(new Event("change", { bubbles: true }));
    await wait(320);
    return true;
  }

  function domReady() {
    if (document.readyState !== "loading") return Promise.resolve();
    return new Promise(function (res) {
      document.addEventListener("DOMContentLoaded", res, { once: true });
    });
  }

  async function run() {
    const M = window.PVModel, P = window.PVPayment;

    // --- wersja i usunięte podsystemy -------------------------------------
    ok("wersja 2.0.0", M.VERSION === "2.0.0", M.VERSION);
    ok("brak modułu licencji", !window.PVLicense);
    ok("brak kluczy licencyjnych", !window.PVKeys);
    ok("brak eksportu XLSX", !window.PVXlsx);
    ok("brak helpera ZIP", !window.PVZip);

    // --- bramka płatności --------------------------------------------------
    P.clearConfig();
    P.reset();
    ok("cena 30 zł", P.PRICE_ZL === 30);
    ok("cena 3000 groszy", P.PRICE_GROSZE === 3000);
    ok("waluta PLN", P.CURRENCY === "PLN");
    ok("brak konfiguracji na start", P.configured() === false);
    const session = P.newSession();
    ok("sesja to 32 znaki hex", /^[0-9a-f]{32}$/.test(session), session);
    ok("checkout wskazuje Przelewy24", P.checkoutUrl(session).indexOf("przelewy24.pl") >= 0);
    ok("sesja nieopłacona", P.isPaid(session) === false);
    ok("potwierdzenie testowe działa", P.confirmTest(session) === true);
    ok("sesja opłacona po potwierdzeniu", P.isPaid(session) === true);
    P.consume(session);
    ok("opłata zużyta po PDF", P.isPaid(session) === false);
    ok("brak tajnych danych w konfiguracji",
       JSON.stringify(P.config()).indexOf("crc") < 0 &&
       JSON.stringify(P.config()).indexOf("apiKey") < 0);
    P.reset();

    // --- zgodność kalkulatora z desktopem ---------------------------------
    // [roof, protected, ha, kw] -> [ścieżka, liczba kroków, E, P, uwaga]
    const cases = [
      [[false,false,1,6],    [1,1,0,0,0]],
      [[false,false,1,10],   [2,3,0,0,0]],
      [[true,false,1,10],    [2,3,0,0,0]],
      [[true,false,1,100],   [3,4,0,0,0]],
      [[false,false,1,100],  [5,5,0,0,0]],
      [[false,true,0.6,100], [5,5,1,0,1]],
      [[false,false,3,200],  [7,6,1,1,0]],
      [[false,true,0.6,200], [7,6,1,1,0]],
      [[true,false,1,1200],  [8,5,0,1,0]],
      [[false,false,1,1200], [9,6,0,1,0]],
      [[false,true,1,1200],  [10,7,1,1,0]],
    ];
    cases.forEach(function (item) {
      const c = item[0], e = item[1];
      const r = M.calculate(c[0], c[1], c[2], c[3], "p", "l");
      const got = [r.path_no, r.steps.length, r.env ? 1 : 0, r.perm ? 1 : 0, r.warning ? 1 : 0];
      ok("parity " + c.join(","), JSON.stringify(got) === JSON.stringify(e), JSON.stringify(got));
    });

    // --- liczba paneli, koszty i czas realizacji (tylko web) ----------------
    ok("presety modułów dostępne", M.MODULE_PRESETS.length >= 5,
       String(M.MODULE_PRESETS.length));
    const jinko = M.MODULE_PRESETS.filter(function (m) { return m.id === "jinko440"; })[0];
    ok("cena Jinko z rynku PL", !!jinko && jinko.wp === 440 && jinko.price === 350,
       JSON.stringify(jinko));
    ok("źródło cen w modelu", M.COST_SOURCE_LINE.indexOf("bursatm.pl") >= 0 &&
       M.COST_SOURCE_LINE.indexOf("e-greenpower.pl") >= 0);

    const estOpts = {
      panelWp: 440, panelAreaM2: 2, coveragePct: 80,
      modulePriceZl: 350, bosPerPanelZl: 250,
      laborPerPanelZl: 300, panelsPerDay: 12,
    };
    const est = M.estimate(1, 6, estOpts);
    ok("panele z powierzchni 1ha×80%/2m² = 4000", est.panels === 4000, String(est.panels));
    ok("powierzchnia użyteczna 8000 m²", est.usableAreaM2 === 8000, String(est.usableAreaM2));
    ok("moc z paneli 1760 kW", Math.abs(est.installedKw - 1760) < 0.001,
       String(est.installedKw));
    ok("koszt modułów 1 400 000 zł", est.moduleZl === 1400000, String(est.moduleZl));
    ok("materiały 2 400 000 zł", est.materialZl === 2400000, String(est.materialZl));
    ok("robocizna 1 200 000 zł", est.laborZl === 1200000, String(est.laborZl));
    ok("razem 3 600 000 zł", est.totalZl === 3600000, String(est.totalZl));
    ok("czas realizacji 334 dni", est.days === 334, String(est.days));
    ok("zaokrąglenie w dół przy reszcie",
       M.estimate(1, 6, { panelAreaM2: 3, coveragePct: 100 }).panels === 3333);
    ok("pokrycie ograniczone do 100%",
       M.estimate(1, 6, { coveragePct: 150 }).options.coveragePct === 100);
    ok("domyślne ustawienia scalone", M.estimateOptions().panelWp === 440 &&
       M.estimateOptions().coveragePct === 80);
    ok("format kwoty PL", /^\d[\d\u00A0 ]*,\d{2} zł$/.test(M.money(2526000)),
       JSON.stringify(M.money(2526000)));
    ok("kwota zero", M.money(0) === "0,00 zł", M.money(0));
    ok("uwaga o rozbieżności mocy", est.powerNote.indexOf("różni się") >= 0, est.powerNote);
    ok("uwaga o zgodności mocy",
       M.estimate(1, 1760, estOpts).powerNote.indexOf("zgodna") >= 0);

    // --- moduły 600 Wp i dobór najtańszego wariantu ------------------------
    const six = ["jinko600", "longi600", "canadian600"].map(function (id) {
      return M.MODULE_PRESETS.filter(function (m) { return m.id === id; })[0];
    });
    ok("trzy marki 600 Wp na rynku PL",
       six.length === 3 && six.every(function (m) {
         return !!m && m.wp === 600 && m.area === 2.70;
       }), JSON.stringify(six));
    ok("ceny 600 Wp orientacyjne z zł/Wp",
       six.map(function (m) { return m.price; }).join(",") === "470,490,455",
       six.map(function (m) { return m.price; }).join(","));
    ok("źródło opisuje wyliczenie 600 Wp",
       M.COST_SOURCE_LINE.indexOf("600 Wp") >= 0 &&
       M.COST_SOURCE_LINE.indexOf("0,76–0,82 zł/Wp") >= 0);

    const optPower = M.optimize("power", 1, 6, estOpts);
    ok("ranking rosnąco wg kosztu całkowitego",
       optPower.list.every(function (x, i) {
         return i === 0 || optPower.list[i - 1].totalZl <= x.totalZl;
       }));
    ok("ranking ma 9 modułów", optPower.list.length === 9, String(optPower.list.length));
    ok("najtańszy dla 6 kW: Canadian 600W",
       optPower.cheapest.id === "canadian600" && optPower.cheapest.panels === 10 &&
       optPower.cheapest.totalZl === 10050,
       JSON.stringify(optPower.cheapest));
    ok("moc z paneli >= moc docelowa",
       optPower.cheapest.installedKw >= 6 && optPower.cheapest.installedKw < 6.6,
       String(optPower.cheapest.installedKw));
    ok("rekomendacja mieści się w powierzchni",
       optPower.recommended && optPower.recommended.id === "canadian600" &&
       optPower.recommended.fitsArea);
    ok("różnica vs najdroższy wyceniona",
       optPower.savingsZl === 3012, String(optPower.savingsZl));

    const three = M.optimize("power", 1, 1.8, estOpts).cheapest;
    ok("1,8 kW = 3 panele 600 Wp",
       three.id === "canadian600" && three.panels === 3 &&
       Math.abs(three.installedKw - 1.8) < 1e-9 && three.totalZl === 3015,
       JSON.stringify(three));

    const optArea = M.optimize("area", 1, 6, estOpts);
    ok("najtańszy z powierzchni 1 ha",
       optArea.cheapest.id === "canadian600" && optArea.cheapest.panels === 2962 &&
       optArea.cheapest.totalZl === 2976810,
       JSON.stringify(optArea.cheapest));
    ok("powierzchnia wykorzystana w trybie ha",
       Math.abs(optArea.cheapest.neededM2 - 2962 * 2.70) < 1e-6);

    const tight = M.optimize("power", 0.00325, 6, estOpts);
    ok("rekomendacja omija moduł, który się nie mieści",
       tight.cheapest.id === "canadian600" && tight.recommended.id === "longi445",
       JSON.stringify([tight.cheapest.id, tight.recommended && tight.recommended.id]));
    ok("brak rekomendacji przy zbyt małej powierzchni",
       M.optimize("power", 0.001, 6, estOpts).recommended === null);
    ok("uwaga o zerowym pokryciu",
       M.optimize("power", 1, 6, { coveragePct: 0 }).note.indexOf("Pokrycie") >= 0);
    ok("zaokrąglenie w górę przy mocy",
       M.optimize("power", 1, 6.1, estOpts).cheapest.panels === 11);

    const both = M.optimize("both", 1, 6, estOpts);
    ok("dobór z obu: minimum mocy i powierzchni",
       both.mode === "both" && both.recommended &&
       both.recommended.panels === Math.min(both.recommended.powerPanels,
                                           both.recommended.areaPanels) &&
       both.recommended.meetsPower,
       JSON.stringify(both.recommended));
    const bothTight = M.optimize("both", 0.001, 6, estOpts);
    ok("dobór z obu: powierzchnia ogranicza moc",
       bothTight.recommended && bothTight.recommended.panels > 0 &&
       !bothTight.recommended.meetsPower &&
       bothTight.note.indexOf("Powierzchnia ogranicza moc") >= 0,
       bothTight.note);
    ok("wycena przyjmuje liczbę paneli z doboru",
       M.estimate(1, 6, estOpts, 17).panels === 17 &&
       M.estimate(1, 6, estOpts, 17).panelsFromOverride === true);

    // --- PDF ----------------------------------------------------------------
    const r = M.calculate(false, false, 1, 6, M.PLACE_GROUND, M.LOC_NORMAL);
    const pdf = await window.PVPdf.renderPdf(r);
    const dec = new TextDecoder();
    const head = dec.decode(pdf.slice(0, 8));
    const tail = dec.decode(pdf.slice(-16));
    const text = dec.decode(pdf);
    ok("PDF: nagłówek 1.4", head === "%PDF-1.4", head);
    ok("PDF: JPEG /DCTDecode", text.indexOf("/DCTDecode") >= 0);
    ok("PDF: A4 2480x3508", text.indexOf("/Width 2480 /Height 3508") >= 0);
    ok("PDF: EOF", tail.indexOf("%%EOF") >= 0, JSON.stringify(tail));
    ok("znak wodny wersji testowej w dwóch liniach",
       window.PVPdf.watermark === "BIM ARCHITECTS & CONSULTANTS\nWERSJA TESTOWA" &&
       window.PVPdf.watermarkLines.length === 2 &&
       window.PVPdf.watermarkLines[0] === "BIM ARCHITECTS & CONSULTANTS" &&
       window.PVPdf.watermarkLines[1] === "WERSJA TESTOWA" &&
       typeof window.PVPdf.drawWatermark === "function",
       String(window.PVPdf.watermark));
    const wmCalls = [];
    window.PVPdf.drawWatermark({
      save: function () {}, restore: function () {}, translate: function () {}, rotate: function () {},
      fillText: function (line) { wmCalls.push(line); }
    }, "#000000");
    ok("znak wodny rysuje dwie linie",
       wmCalls.length === 2 && wmCalls[0] === "BIM ARCHITECTS & CONSULTANTS" && wmCalls[1] === "WERSJA TESTOWA",
       wmCalls.join(" | "));

    // --- porównanie OZE --------------------------------------------------------
    ok("model ma compareMetrics", typeof M.compareMetrics === "function");
    ok("model ma COMPARE_DEFAULT", !!M.COMPARE_DEFAULT && M.COMPARE_DEFAULT.pricePlnMwh > 0);
    var cmpPv = M.compareMetrics("pv", {energyMwhYear:10, capexPln:20000, opexPlnYear:200}, {}, {pricePlnMwh:800});
    ok("compareMetrics pv bilans", Math.abs(cmpPv.netPlnYear - 7800) < 0.01, cmpPv.netPlnYear);
    var cmpGeo = M.compareMetrics("geotermia", {heatMwhYear:20, capexPln:50000, opexPlnYear:500, electricityCostPlnYear:1000}, {}, {pricePlnMwh:700});
    ok("compareMetrics geo dolicza prąd", Math.abs(cmpGeo.opexPlnYear - 1500) < 0.01, cmpGeo.opexPlnYear);
    ok("compareMetrics brak zwrotu przy bilansie <=0", M.compareMetrics("wiatr",{energyMwhYear:1,capexPln:1000,opexPlnYear:2000},{},{pricePlnMwh:100}).paybackYears === null);
    ok("fmtPayback: dwa miejsca (0)", M.fmtPayback(0) === "0,00 lat", M.fmtPayback(0));
    ok("fmtPayback: dwa miejsca (3,14159)", M.fmtPayback(3.14159) === "3,14 lat", M.fmtPayback(3.14159));
    ok("fmtPayback: brak zwrotu", M.fmtPayback(null) === "brak zwrotu", M.fmtPayback(null));
    const xrefPos = Number(/startxref\n(\d+)/.exec(text)[1]);
    ok("PDF: xref wskazuje poprawny offset", dec.decode(pdf.slice(xrefPos, xrefPos + 4)) === "xref");
    const pdfEst = await window.PVPdf.renderPdf(r, est, optPower);
    ok("PDF: sekcja wyceny bez błędu",
       dec.decode(pdfEst.slice(0, 8)) === "%PDF-1.4" &&
       dec.decode(pdfEst.slice(-16)).indexOf("%%EOF") >= 0);
    ok("PDF: ranking optymalizatora bez błędu",
       dec.decode(pdfEst.slice(0, 8)) === "%PDF-1.4" &&
       dec.decode(pdfEst.slice(-16)).indexOf("%%EOF") >= 0);

    // --- OZE ---------------------------------------------------------------
    ok("OZE: źródła zdefiniowane", Array.isArray(window.PVModel.OZE_SOURCES) && window.PVModel.OZE_SOURCES.length === 5);
    ok("OZE: zawiera PV/wiatr/woda/geotermia/biomasa",
       ["pv","wiatr","woda","geotermia","biomasa"].every(function(id){ return !!window.PVModel.ozeById(id); }));
    ok("OZE: źródło gov.pl", /edukacja-ekologiczna/.test(window.PVModel.OZE_GOV_SOURCE.url));
    ok("OZE: disclaimer", /orientacyjny/i.test(window.PVModel.OZE_DISCLAIMER));
    ok("OZE: disclaimer bez słowa edukacyjny",
       window.PVModel.OZE_DISCLAIMER.indexOf("edukacyjny") < 0);
    ok("OZE: disclaimer KPK z datą źródeł",
       /KPK/.test(window.PVModel.OZE_DISCLAIMER) &&
       window.PVModel.OZE_DISCLAIMER.indexOf("24.11.2026") >= 0);
    ok("OZE: źródło KPK gov.pl",
       !!window.PVModel.OZE_KPK_SOURCE &&
       /kontaktoze/.test(window.PVModel.OZE_KPK_SOURCE.url));
    ok("OZE PV: link do modułu głównego",
       window.PVModel.ozeById("pv").calculator.href === "#/pv");
    const kpkExpected = {
      pv: "Kroki PV w głównym module",
      wiatr: "Planistyka",
      woda: "Uzyskanie pozwolenia wodnoprawnego",
      geotermia: "Rozpoznanie warunków geologicznych i hydrogeologicznych",
      biomasa: "Uzyskanie pozwoleń środowiskowych"
    };
    ["pv","wiatr","woda","geotermia","biomasa"].forEach(function(id){
      const s = window.PVModel.ozeById(id);
      const steps = (s && s.formalPath && s.formalPath.steps) || [];
      const srcs = (s && s.formalPath && s.formalPath.sources) || [];
      ok("OZE " + id + ": krok KPK " + kpkExpected[id],
         steps.some(function(st){ return st.name === kpkExpected[id]; }));
      ok("OZE " + id + ": checklista do PDF (3-8 kroków)",
         steps.length >= 3 && steps.length <= 8,
         String(steps.length));
      ok("OZE " + id + ": kroki mają weryfikację",
         steps.every(function(st){ return !!st.sourceHint && (st.status === "verify" || st.status === "ready"); }));
      ok("OZE " + id + ": linki KPK gov.pl",
         srcs.some(function(x){ return /gov\.pl\/web\/kontaktoze\//.test(x.url); }));
    });
    ok("OZE PV: nazwy kroków KPK (kolektory, magazyn)",
       (function(){
         const n = window.PVModel.ozeById("pv").formalPath.steps.map(function(st){ return st.name; });
         return n.indexOf("Proces inwestycyjny kolektorów słonecznych") >= 0 &&
                n.indexOf("Zgłoszenie magazynu/uzyskanie warunków") >= 0;
       })());
    ok("OZE Wiatr: krok MFW z KPK",
       window.PVModel.ozeById("wiatr").formalPath.steps.some(function(st){
         return st.name === "Uzyskanie decyzji o środowiskowych uwarunkowaniach dla całej inwestycji";
       }));
    ok("OZE Geotermia: krok pompy ciepła z KPK",
       window.PVModel.ozeById("geotermia").formalPath.steps.some(function(st){
         return st.name === "Powietrzna pompa ciepła";
       }));
    ok("OZE PV: kolektory i magazyn energii w źródłach",
       (function(){
         const u = window.PVModel.ozeById("pv").formalPath.sources.map(function(x){ return x.url; }).join(" ");
         return u.indexOf("proces-inwestycyjny-kolektorow-slonecznych2") >= 0 &&
                u.indexOf("instalacja-magazynu-energii-elektrycznej-o-mocy-do-50-kw") >= 0;
       })());
    ok("OZE Wiatr: morskie farmy w źródłach",
       window.PVModel.ozeById("wiatr").formalPath.sources.some(function(x){
         return x.url.indexOf("proces-inwestycyjny-morskich-farm-wiatrowych") >= 0;
       }));
    ok("OZE Geotermia: pompy ciepła w źródłach",
       window.PVModel.ozeById("geotermia").formalPath.sources.some(function(x){
         return x.url.indexOf("powietrzna-pompa-ciepla") >= 0;
       }));
    ok("OZE Biomasa: biogaz/biometan/biopłyny w źródłach",
       (function(){
         const u = window.PVModel.ozeById("biomasa").formalPath.sources.map(function(x){ return x.url; }).join(" ");
         return u.indexOf("mikroinstalacja2") >= 0 &&
                u.indexOf("mikroinstalacja10") >= 0 &&
                u.indexOf("mala-instalacja5") >= 0;
       })());
    const wind = window.PVModel.ozeCalculate("wiatr", {powerKw:10,diameterM:5.5,windMs:6,cp:0.35,efficiency:0.9,hoursYear:2600,capexPlnKw:9000,opexPct:2.5});
    ok("OZE wiatr: energia > 0", wind && wind.energyMwhYear > 0);
    ok("OZE wiatr: moc > 0", wind && wind.powerFromWindKw > 0);
    const hydro = window.PVModel.ozeCalculate("woda", {flowLps:250,headM:8,efficiency:0.7,hoursYear:4500,capexPlnKw:12000,opexPct:2});
    ok("OZE woda: moc ~13,7 kW", hydro && Math.abs(hydro.powerKw - 13.734) < 0.2);
    const geo = window.PVModel.ozeCalculate("geotermia", {heatDemandKw:12,cop:4,hoursSeason:2000,electricityPlnMwh:900,capexPlnKw:4500,opexPct:1.5});
    ok("OZE geo: ciepło 24 MWh", geo && Math.abs(geo.heatMwhYear - 24) < 0.001);
    ok("OZE geo: el 6 MWh", geo && Math.abs(geo.electricityMwhYear - 6) < 0.001);
    const bio = window.PVModel.ozeCalculate("biomasa", {fuelTonsYear:120,gcvKwhKg:4.2,efficiency:0.75,hoursYear:4000,pricePlnTon:900,capexPlnKw:5000,opexPct:4});
    ok("OZE biomasa: energia > 0", bio && bio.energyMwhYear > 0);
    ok("OZE biomasa: koszt paliwa 108000", bio && Math.abs(bio.fuelCostPlnYear - 108000) < 0.01);
    ["wiatr","woda","geotermia","biomasa"].forEach(function(id){
      const s = window.PVModel.ozeById(id);
      ok("OZE ścieżka " + id, s && s.formalPath && s.formalPath.steps.length >= 4);
      ok("OZE źródła " + id, s && s.formalPath && s.formalPath.sources.length >= 1);
    });
    location.hash = "#/wiatr"; await wait(120);
    ok("UI: zakładka wiatr", !!document.querySelector('#steps a[href="#/wiatr"]'));
    ok("UI: zakładka woda", !!document.querySelector('#steps a[href="#/woda"]'));
    ok("UI: zakładka geotermia", !!document.querySelector('#steps a[href="#/geotermia"]'));
    ok("UI: strona wiatr", !!document.getElementById("oze-wiatr-powerKw"));
    ok("UI: KPK i statusy do potwierdzenia w widoku OZE",
       (document.querySelector("#view").textContent || "").indexOf("KPK gov.pl") >= 0 &&
       document.querySelectorAll("#view .badge.warn").length >= 8);
    ok("UI: sekcja źródła do weryfikacji usunięta",
       (document.querySelector("#view").textContent || "").indexOf("Źródła do weryfikacji") < 0 &&
       !Array.prototype.some.call(document.querySelectorAll("#view a[href]"), function(a){
         return /gov\.pl\/web\/kontaktoze\//.test(a.getAttribute("href") || "");
       }));
    location.hash = "#/woda"; await wait(120);
    ok("UI: przełączanie OZE woda", !!document.getElementById("oze-woda-flowLps"));
    location.hash = "#/geotermia"; await wait(120);
    ok("UI: przełączanie OZE geotermia", !!document.getElementById("oze-geotermia-heatDemandKw"));
    location.hash = "#/biomasa"; await wait(120);
    ok("UI: przełączanie OZE biomasa", !!document.getElementById("oze-biomasa-fuelTonsYear"));

    const mc = document.createElement("canvas").getContext("2d");
    mc.font = Math.round(10 * 150 / 72) + 'px "DejaVu", sans-serif';
    const labelW = mc.measureText("Konstrukcja, falownik, osprzęt").width;
    ok("PDF: etykiety wyceny mieszczą się w kolumnie", labelW < 330,
       labelW.toFixed(1) + "px");

    const canvas = document.createElement("canvas");
    const pages = await window.PVPdf.renderPreview(r, canvas, est, optPower);
    ok("podgląd A4@300dpi", canvas.width === 2480 && canvas.height === 3508 && pages === 1,
       canvas.width + "x" + canvas.height + " pages=" + pages);

    const bothEst = M.estimate(1, 6, estOpts, both.recommended.panels);
    const bothCanvas = document.createElement("canvas");
    const bothPages = await window.PVPdf.renderPreview(r, bothCanvas, bothEst, both);
    ok("podgląd doboru z obu mieści się na jednej stronie A4", bothPages === 1,
       "pages=" + bothPages);

    // --- trzy style raportu PDF --------------------------------------------
    const themes = window.PVPdf.themes;
    ok("trzy style PDF dostępne",
       themes.length === 3 &&
       themes.map(function (t) { return t.id; }).join(",") === "simple,cards,premium" &&
       window.PVPdf.defaultTheme === "premium",
       JSON.stringify(themes));
    ok("style nazywają się Motyw 1, Motyw 2, Motyw 3",
       themes.map(function (t) { return t.label; }).join(",") === "Motyw 1,Motyw 2,Motyw 3" &&
       window.PVPdf.lineHeight("small") >= 20 &&
       window.PVPdf.lineHeight("body") >= 22,
       themes.map(function (t) { return t.label; }).join(","));
    const shSimple = window.PVPdf.themeShape("simple"),
          shCards = window.PVPdf.themeShape("cards"),
          shPremium = window.PVPdf.themeShape("premium");
    const cornerCalls = function (radius) {
      const calls = [];
      window.PVPdf.roundedRectPath({
        beginPath: function () {}, rect: function () { calls.push("rect"); },
        moveTo: function () {}, arcTo: function () { calls.push("arcTo"); },
        closePath: function () {}
      }, 0, 0, 100, 50, radius);
      return calls.join(",");
    };
    ok("motywy: ostre kąty, zaokrąglone karty, większy promień premium",
       shSimple.radius === 0 && shSimple.badge === "square" &&
       shCards.radius > 0 && shCards.badge === "circle" &&
       shPremium.radius > shCards.radius && shPremium.badge === "rounded" &&
       cornerCalls(0) === "rect" && cornerCalls(12).indexOf("arcTo") >= 0,
       [shSimple.radius, shCards.radius, shPremium.radius].join(","));
    const themed = {};
    for (const t of themes) {
      const bytes = await window.PVPdf.renderPdf(r, est, optPower, t.id);
      themed[t.id] = bytes;
      ok("PDF: styl " + t.id + " bez błędu",
         dec.decode(bytes.slice(0, 8)) === "%PDF-1.4" &&
         dec.decode(bytes.slice(-16)).indexOf("%%EOF") >= 0 &&
         bytes.length > 10000, String(bytes.length));
      const cv = document.createElement("canvas");
      const n = await window.PVPdf.renderPreview(r, cv, est, optPower, t.id);
      ok("podgląd: styl " + t.id + " ma stronę A4",
         cv.width === 2480 && cv.height === 3508 && n === 1, "pages=" + n);
    }
    ok("style dają różne pliki",
       themed.simple.length !== themed.cards.length &&
       themed.cards.length !== themed.premium.length &&
       themed.simple.length !== themed.premium.length,
       [themed.simple.length, themed.cards.length, themed.premium.length].join(","));

    // --- dostęp bez opłaty w wersji testowej (Routing w/js/app.js) ----------
    await domReady();
    await nextTick();
    P.reset();

    ok("wersja testowa włączona", P.isTestMode() === true);
    ok("brak konfiguracji na start", P.configured() === false);

    location.hash = "#/start"; await wait(150);
    const startText = document.querySelector("#view").textContent || "";
    const iconCards = [...document.querySelectorAll("#view .start-tab-grid > button.start-tab-card")];
    ok("Start: 6 ikon-kafli jako przyciski",
       iconCards.length === 6 && iconCards.every(function (b) { return !!b.querySelector("svg"); }),
       String(iconCards.length));
    const goButtons = [...document.querySelectorAll('#view button[data-act="go"]')];
    ok("Start: brak powielonych tekstowych przycisków zakładek",
       !document.querySelector("#view .hero-actions") &&
       goButtons.length === 6 && goButtons.every(function (b) { return !!b.closest(".start-tab-grid"); }),
       String(goButtons.length));
    ok("Start: brak przycisku Otwórz zakładkę", startText.indexOf("Otwórz zakładkę") < 0);
    ok("Start: brak (do potwierdzenia)", startText.indexOf("do potwierdzenia") < 0);
    const iconGrid = document.querySelector("#view .start-tab-grid");
    const iconCols = iconGrid ? getComputedStyle(iconGrid).gridTemplateColumns.split(/\s+/).filter(Boolean).length : 0;
    ok("Start: siatka ikon w 3-4 kolumnach", iconCols >= 3 && iconCols <= 4, String(iconCols));
    iconCards[0].click(); await wait(150);
    ok("Start: ikona otwiera zakładkę", location.hash === "#/pv", location.hash);

    location.hash = "#/pv";
    await nextTick();
    const resetBtn = document.querySelector('[data-act="reset"]');
    if (resetBtn) resetBtn.click();
    await nextTick();
    ok("formularz ma tylko moc i powierzchnię",
       !!document.querySelector("#f-ha") && !!document.querySelector("#f-kw") &&
       !!document.querySelector("#f-area-unit") && !!document.querySelector("#f-power-unit") &&
       !document.querySelector("#f-place") && !document.querySelector("#f-protected") &&
       !document.querySelector("#f-preset") && !document.querySelector("#f-panelarea") &&
       !document.querySelector("#f-coverage") && !document.querySelector("#f-labor") &&
       !document.querySelector("#f-opt-mode"));
    const powerInput = document.querySelector("#f-kw") || document.querySelector("#f-w");
    const powerField = powerInput ? powerInput.closest(".field") : null;
    const panelNote = [...document.querySelectorAll("#view p.panel-note")]
       .find(function (el) { return (el.textContent || "").indexOf("Liczba paneli jest dobierana") >= 0; });
    ok("Podpowiedź o liczbie paneli jest pod formularzem, nie pod mocą",
       !!panelNote && !!powerField &&
       (powerField.compareDocumentPosition(panelNote) & Node.DOCUMENT_POSITION_FOLLOWING) === 4 &&
       (powerField.textContent || "").indexOf("Liczba paneli jest dobierana") < 0);
    ok("zakładki ukryte: płatność/wynik/podgląd/o programie",
       !document.querySelector('#steps a[href="#/platnosc"]') &&
       !document.querySelector('#steps a[href="#/wynik"]') &&
       !document.querySelector('#steps a[href="#/podglad"]') &&
       !document.querySelector('#steps a[href="#/o-programie"]'));
    ok("wynik PV w zakładce",
       !!document.querySelector("#pv-wynik") && !!document.querySelector("#view .verdict-grid"));
    ok("PV: nagłówek Wynik analizy usunięty",
       (document.querySelector("#view").textContent || "").indexOf("Wynik analizy") < 0);
    const wynikText = document.querySelector("#view").textContent || "";
    ok("wynik pokazuje wycenę i czas",
       !!document.querySelector("#view .est-panel") &&
       wynikText.indexOf("Wycena i czas realizacji") >= 0 &&
       wynikText.indexOf("Liczba paneli") >= 0 &&
       wynikText.indexOf("RAZEM") >= 0 &&
       !!document.querySelector("#view .opt-panel") &&
       wynikText.indexOf("Najtańszy wariant") >= 0 &&
       document.querySelectorAll("#view .opt-table tbody tr").length === 9,
       wynikText.slice(0, 160));
    ok("podgląd dostępny w zakładce PV",
       !!document.querySelector("#preview-canvas"), "brak canvasa");
    location.hash = "#/pv";
    await nextTick();
    ok("brak płatności w UI", !document.querySelector('[data-act="pay-open"]') && !document.querySelector('[data-act="pay-confirm"]'));
    location.hash="#/wiatr"; await wait(250);
    ok("OZE ma przycisk PDF", !!document.querySelector('[data-act="oze-pdf"][data-source="wiatr"]'));
    ok("OZE ma podgląd", !!document.querySelector("#preview-canvas"));
    ok("OZE podgląd A4 narysowany", previewPainted() &&
       document.querySelector("#preview-canvas").width === 2480 &&
       document.querySelector("#preview-canvas").height === 3508);
    document.querySelector('[data-act="oze-preview"]').click();
    await wait(250);
    ok("OZE odśwież podgląd bez błędu", previewPainted());
    document.querySelector('[data-act="oze-pdf"]').click();
    await wait(400);
    ok("OZE pobierz PDF bez błędu",
       (document.querySelector(".toast") || {}).textContent === "PDF 300 DPI pobrany.",
       (document.querySelector(".toast") || {}).textContent);
    ok("OZE: wybór 3 stylów podglądu/PDF",
       !!document.querySelector("#f-pdf-theme") &&
       document.querySelectorAll("#f-pdf-theme option").length === 3 &&
       Array.prototype.map.call(document.querySelectorAll("#f-pdf-theme option"),
         function (o) { return (o.textContent || "").trim(); }).join(",") ===
         "Motyw 1,Motyw 2,Motyw 3");
    const ozeOriginalTheme = document.querySelector("#f-pdf-theme").value;
    const ozePixels = {}, ozePdfImages = {};
    for (const t of themes) {
      await setTheme(t.id);
      ozePixels[t.id] = headerPixel();
      ozePdfImages[t.id] = await capturePdfImage('[data-act="oze-pdf"][data-source="wiatr"]');
    }
    ok("OZE: 3 motywy dają różny podgląd",
       new Set(Object.keys(ozePixels).map(function (k) { return ozePixels[k]; })).size === 3,
       JSON.stringify(ozePixels));
    ok("OZE: 3 motywy dają różny obraz w PDF",
       new Set(Object.keys(ozePdfImages).map(function (k) { return bytesFingerprint(ozePdfImages[k]); })).size === 3 &&
       Object.keys(ozePdfImages).every(function (k) { return !!ozePdfImages[k]; }),
       Object.keys(ozePdfImages).map(function (k) { return bytesFingerprint(ozePdfImages[k]).slice(0, 12); }).join(" | "));
    await setTheme(ozeOriginalTheme);

    // Długie opisy nie mogą się nakładać — muszą przejść na kolejną stronę A4.
    const originalOzeById = M.ozeById;
    const longText = " Szczegółowy opis wymagań i procedur sprawdzany w urzędzie " +
      "gminy oraz z innymi instytucjami, w tym z jednostkami oceny jakości " +
      "powietrza i administratorami sieci, może być dłuższy niż jedna strona.";
    M.ozeById = function (id) {
      const src = originalOzeById.call(M, id);
      const steps = [];
      for (let i = 0; i < 8; i++) {
        steps.push({
          name: "Etap " + (i + 1) + " — czynności weryfikacyjne",
          status: i % 2 ? "ready" : "todo",
          desc: "Należy wykonać czynności " + (i + 1) + longText.repeat(10),
        });
      }
      return Object.assign({}, src, {
        description: src.description + longText + longText,
        formalPath: Object.assign({}, src.formalPath, { steps: steps }),
      });
    };
    location.hash = "#/wiatr"; await wait(300);
    const longOzeBytes = await capturePdfImage(
      '[data-act="oze-pdf"][data-source="wiatr"]');
    ok("OZE: długi raport ma wiele stron i bez błędu",
       lastPdfPageCount >= 2 && lastPdfPageCount <= 8 && !!longOzeBytes,
       "pages=" + lastPdfPageCount +
       " bytes=" + (longOzeBytes ? longOzeBytes.length : 0) +
       " toast=" + ((document.querySelector(".toast") || {}).textContent || ""));
    M.ozeById = originalOzeById;

    location.hash="#/porownaj"; await wait(250);
    ok("Porównaj ma przyciski PDF i podglądu",
       !!document.querySelector('[data-act="cmp-pdf"]') &&
       !!document.querySelector('[data-act="cmp-preview"]'));
    ok("Porównaj podgląd A4 narysowany", previewPainted());
    document.querySelector('[data-act="cmp-preview"]').click();
    await wait(250);
    ok("Porównaj odśwież podgląd bez błędu", previewPainted());
    document.querySelector('[data-act="cmp-pdf"]').click();
    await wait(400);
    ok("Porównaj pobierz PDF bez błędu",
       (document.querySelector(".toast") || {}).textContent === "PDF porównania pobrany.",
       (document.querySelector(".toast") || {}).textContent);
    ok("Porównaj: wybór 3 stylów podglądu/PDF",
       !!document.querySelector("#f-pdf-theme") &&
       document.querySelectorAll("#f-pdf-theme option").length === 3);
    const paybackCells = Array.prototype.map.call(
       document.querySelectorAll(".compare-table tbody tr td:last-child strong"),
       function (el) { return (el.textContent || "").trim(); });
    ok("Porównaj: prosty zwrot zawsze z 2 miejscami",
       paybackCells.length === 5 &&
       paybackCells.every(function (t) { return /^\d+,\d{2} lat$/.test(t) || t === "brak zwrotu"; }),
       paybackCells.join(" | "));
    ok("Porównaj: podsumowanie zwrotu z 2 miejscami",
       /Prosty okres zwrotu:\s*\d+,\d{2} lat/.test(document.querySelector("#view").textContent || ""));
    const cmpOriginalTheme = document.querySelector("#f-pdf-theme").value;
    const cmpPixels = {}, cmpPdfImages = {};
    for (const t of themes) {
      await setTheme(t.id);
      cmpPixels[t.id] = headerPixel();
      cmpPdfImages[t.id] = await capturePdfImage('[data-act="cmp-pdf"]');
    }
    ok("Porównaj: 3 motywy dają różny podgląd",
       new Set(Object.keys(cmpPixels).map(function (k) { return cmpPixels[k]; })).size === 3,
       JSON.stringify(cmpPixels));
    ok("Porównaj: 3 motywy dają różny obraz w PDF",
       new Set(Object.keys(cmpPdfImages).map(function (k) { return bytesFingerprint(cmpPdfImages[k]); })).size === 3 &&
       Object.keys(cmpPdfImages).every(function (k) { return !!cmpPdfImages[k]; }),
       Object.keys(cmpPdfImages).map(function (k) { return bytesFingerprint(cmpPdfImages[k]).slice(0, 12); }).join(" | "));
    await setTheme(cmpOriginalTheme);

    location.hash="#/pv"; await wait(150);
    ok("PV: wybór jednostki powierzchni",
       !!document.getElementById("f-area-unit") && document.getElementById("f-area-unit").value === "ha");
    const unit = document.getElementById("f-area-unit");
    unit.value = "m2";
    unit.dispatchEvent(new Event("change", { bubbles: true }));
    await wait(150);
    ok("PV: przełączenie powierzchni na m²",
       !!document.getElementById("f-m2") &&
       Number(document.getElementById("f-m2").value) === 10000,
       (document.getElementById("f-m2") || {}).value);
    document.getElementById("f-m2").value = "5000";
    document.getElementById("f-m2").dispatchEvent(new Event("input", { bubbles: true }));
    document.querySelector('[data-act="pv-scroll-result"]').click();
    await wait(150);
    ok("PV: wpisanie 5000 m² daje 0,5 ha",
       (document.querySelector("#view").textContent || "").indexOf("5000 m² (0,5 ha)") >= 0,
       (document.querySelector("#view").textContent || "").slice(0, 120));

    ok("PV: wybór jednostki mocy",
       !!document.getElementById("f-power-unit") && document.getElementById("f-power-unit").value === "kW");
    const powerUnit = document.getElementById("f-power-unit");
    powerUnit.value = "W";
    powerUnit.dispatchEvent(new Event("change", { bubbles: true }));
    await wait(150);
    ok("PV: przełączenie mocy na W",
       !!document.getElementById("f-w") &&
       Number(document.getElementById("f-w").value) === 6000,
       (document.getElementById("f-w") || {}).value);
    document.getElementById("f-w").value = "6500";
    document.getElementById("f-w").dispatchEvent(new Event("input", { bubbles: true }));
    document.querySelector('[data-act="pv-scroll-result"]').click();
    await wait(150);
    ok("PV: wpisanie 6500 W daje 6,5 kW",
       (document.querySelector("#view").textContent || "").indexOf("6,5 kW") >= 0,
       (document.querySelector("#view").textContent || "").slice(0, 160));

    const themeSelect = document.querySelector("#f-pdf-theme");
    const themePanel = themeSelect && themeSelect.closest(".panel");
    ok("PV: wybór stylu w panelu Podgląd i PDF",
       !!themeSelect && themeSelect.querySelectorAll("option").length === 3 &&
       !!themePanel && (themePanel.textContent || "").indexOf("Podgląd i PDF") >= 0);
    const pvOriginalTheme = themeSelect.value;
    const pvPixels = {}, pvPdfThemes = {};
    for (const t of themes) {
      await setTheme(t.id);
      pvPixels[t.id] = headerPixel();
      pvPdfThemes[t.id] = await captureRenderTheme('[data-act="pdf"]');
    }
    ok("PV: 3 motywy dają różny podgląd",
       new Set(Object.keys(pvPixels).map(function (k) { return pvPixels[k]; })).size === 3,
       JSON.stringify(pvPixels));
    ok("PV: PDF używa wybranego motywu",
       themes.every(function (t) { return pvPdfThemes[t.id] === t.id; }),
       JSON.stringify(pvPdfThemes));
    await setTheme(pvOriginalTheme);
    ok("PV: zmiana motywu zachowuje dane formularza",
       (document.querySelector("#view").textContent || "").indexOf("6,5 kW") >= 0);

    location.hash="#/biomasa"; await wait(80);
      ok("UI: strona biomasa", !!document.getElementById("oze-biomasa-fuelTonsYear")); ok("nawigacja ma PV", !!document.querySelector('#steps a[href="#/pv"]'),
       (document.querySelector("#steps")||{}).innerHTML ? document.querySelector("#steps").innerHTML.slice(0,120) : "no-steps");

     await wait(200);
     ok("brak błędów w konsoli", consoleErrors.length === 0, consoleErrors.join(" | "));
  }

  run().catch(function (err) {
    fail++;
    lines.push("FAIL  wyjątek: " + (err && err.stack ? err.stack : err));
  }).then(finish);
})();
</script>
</body>
</html>
