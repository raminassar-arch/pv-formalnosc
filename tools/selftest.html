<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>uruchamianie testów…</title>
<link rel="stylesheet" href="../app.css">
</head>
<body>
<div class="panel" style="max-width:900px;margin:24px auto">
  <h1>PV Formalność 2.0 — testy wersji web</h1>
  <pre id="out">Uruchamianie…</pre>
</div>
<div id="app"></div>

<script src="../js/model.js"></script>
<script src="../js/payment.js"></script>
<script src="../js/pdf.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
  "use strict";
  const out = document.getElementById("out");
  const lines = [];
  let pass = 0, fail = 0;

  function ok(name, condition, detail) {
    if (condition) { pass++; lines.push("PASS  " + name); }
    else { fail++; lines.push("FAIL  " + name + (detail ? "  -> " + detail : "")); }
  }

  function finish() {
    lines.push("", "TOTAL " + pass + " PASS / " + fail + " FAIL");
    document.title = (fail ? "FAIL " : "PASS ") + pass + "/" + (pass + fail);
    out.textContent = lines.join("\n");
  }

  function nextTick() {
    return new Promise(function (res) { setTimeout(res, 60); });
  }

  function domReady() {
    if (document.readyState !== "loading") return Promise.resolve();
    return new Promise(function (res) {
      document.addEventListener("DOMContentLoaded", res, { once: true });
    });
  }

  async function run() {
    const M = window.PVModel, P = window.PVPayment;

    // --- wersja i usunięte podsystemy -------------------------------------
    ok("wersja 2.0.0", M.VERSION === "2.0.0", M.VERSION);
    ok("brak modułu licencji", !window.PVLicense);
    ok("brak kluczy licencyjnych", !window.PVKeys);
    ok("brak eksportu XLSX", !window.PVXlsx);
    ok("brak helpera ZIP", !window.PVZip);

    // --- bramka płatności --------------------------------------------------
    P.clearConfig();
    P.reset();
    ok("cena 30 zł", P.PRICE_ZL === 30);
    ok("cena 3000 groszy", P.PRICE_GROSZE === 3000);
    ok("waluta PLN", P.CURRENCY === "PLN");
    ok("brak konfiguracji na start", P.configured() === false);
    const session = P.newSession();
    ok("sesja to 32 znaki hex", /^[0-9a-f]{32}$/.test(session), session);
    ok("checkout wskazuje Przelewy24", P.checkoutUrl(session).indexOf("przelewy24.pl") >= 0);
    ok("sesja nieopłacona", P.isPaid(session) === false);
    ok("potwierdzenie testowe działa", P.confirmTest(session) === true);
    ok("sesja opłacona po potwierdzeniu", P.isPaid(session) === true);
    P.consume(session);
    ok("opłata zużyta po PDF", P.isPaid(session) === false);
    ok("brak tajnych danych w konfiguracji",
       JSON.stringify(P.config()).indexOf("crc") < 0 &&
       JSON.stringify(P.config()).indexOf("apiKey") < 0);
    P.reset();

    // --- zgodność kalkulatora z desktopem ---------------------------------
    // [roof, protected, ha, kw] -> [ścieżka, liczba kroków, E, P, uwaga]
    const cases = [
      [[false,false,1,6],    [1,1,0,0,0]],
      [[false,false,1,10],   [2,3,0,0,0]],
      [[true,false,1,10],    [2,3,0,0,0]],
      [[true,false,1,100],   [3,4,0,0,0]],
      [[false,false,1,100],  [5,5,0,0,0]],
      [[false,true,0.6,100], [5,5,1,0,1]],
      [[false,false,3,200],  [7,6,1,1,0]],
      [[false,true,0.6,200], [7,6,1,1,0]],
      [[true,false,1,1200],  [8,5,0,1,0]],
      [[false,false,1,1200], [9,6,0,1,0]],
      [[false,true,1,1200],  [10,7,1,1,0]],
    ];
    cases.forEach(function (item) {
      const c = item[0], e = item[1];
      const r = M.calculate(c[0], c[1], c[2], c[3], "p", "l");
      const got = [r.path_no, r.steps.length, r.env ? 1 : 0, r.perm ? 1 : 0, r.warning ? 1 : 0];
      ok("parity " + c.join(","), JSON.stringify(got) === JSON.stringify(e), JSON.stringify(got));
    });

    // --- PDF ----------------------------------------------------------------
    const r = M.calculate(false, false, 1, 6, M.PLACE_GROUND, M.LOC_NORMAL);
    const pdf = await window.PVPdf.renderPdf(r);
    const dec = new TextDecoder();
    const head = dec.decode(pdf.slice(0, 8));
    const tail = dec.decode(pdf.slice(-16));
    const text = dec.decode(pdf);
    ok("PDF: nagłówek 1.4", head === "%PDF-1.4", head);
    ok("PDF: JPEG /DCTDecode", text.indexOf("/DCTDecode") >= 0);
    ok("PDF: A4 2480x3508", text.indexOf("/Width 2480 /Height 3508") >= 0);
    ok("PDF: EOF", tail.indexOf("%%EOF") >= 0, JSON.stringify(tail));
    const xrefPos = Number(/startxref\n(\d+)/.exec(text)[1]);
    ok("PDF: xref wskazuje poprawny offset", dec.decode(pdf.slice(xrefPos, xrefPos + 4)) === "xref");

    const canvas = document.createElement("canvas");
    const pages = await window.PVPdf.renderPreview(r, canvas);
    ok("podgląd A4@300dpi", canvas.width === 2480 && canvas.height === 3508 && pages === 1,
       canvas.width + "x" + canvas.height + " pages=" + pages);

    // --- bramka przed wynikiem (Routing w/js/app.js) -----------------------
    await domReady();
    await nextTick();
    P.clearConfig();
    P.reset();

    location.hash = "#/wynik";
    await nextTick();
    ok("wynik bez opłaty idzie do płatności", location.hash === "#/platnosc", location.hash);

    location.hash = "#/podglad";
    await nextTick();
    ok("podgląd bez opłaty idzie do płatności", location.hash === "#/platnosc", location.hash);

    const paidSession = P.newSession();
    P.confirmTest(paidSession);
    location.hash = "#/wynik";
    await nextTick();
    ok("po opłacie wynik widoczny",
       location.hash === "#/wynik" && !!document.querySelector("#view .verdict-grid"),
       location.hash);

    location.hash = "#/podglad";
    await nextTick();
    ok("po opłacie podgląd widoczny",
       location.hash === "#/podglad" && !!document.querySelector("#preview-canvas"),
       location.hash);

    P.consume(paidSession);
    location.hash = "#/wynik";
    await nextTick();
    ok("po zużyciu opłaty wynik znów blokowany", location.hash === "#/platnosc", location.hash);

    location.hash = "#/start";
    await nextTick();
    const startText = document.querySelector("#view").textContent || "";
    ok("start nie ujawnia ścieżki przed opłatą", startText.indexOf(r.path_name) < 0,
       startText.slice(0, 120));
  }

  run().catch(function (err) {
    fail++;
    lines.push("FAIL  wyjątek: " + (err && err.stack ? err.stack : err));
  }).then(finish);
})();
</script>
</body>
</html>
